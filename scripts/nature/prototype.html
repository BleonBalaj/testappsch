<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1f2933;
    --ink-soft: rgba(31, 41, 51, .62);
    --glass: rgba(255, 255, 255, .26);
    --glass-strong: rgba(255, 255, 255, .88);
    --glass-border: rgba(255, 255, 255, .55);
    --card-ink: #ffffff;
    --accent: #ffb347;
    --shadow: 0 10px 40px rgba(20, 40, 30, .18);
    --t: 1.4s cubic-bezier(.65, 0, .35, 1);
  }
  body[data-phase="golden"] { --accent: #ff9f43; --glass: rgba(255, 240, 225, .28); }
  body[data-phase="night"] {
    --ink: #eef2ff;
    --ink-soft: rgba(238, 242, 255, .6);
    --glass: rgba(120, 140, 200, .16);
    --glass-strong: rgba(214, 222, 255, .9);
    --glass-border: rgba(200, 215, 255, .22);
    --accent: #d8f56b;
    --shadow: 0 10px 40px rgba(0, 0, 20, .4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #9cc3e0; }
  body {
    font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    cursor: grab;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .ui { position: fixed; inset: 0; pointer-events: none; padding: 20px; }
  .glass {
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.35);
    transition: background var(--t), border-color var(--t), box-shadow var(--t), color var(--t);
  }

  /* segmented control */
  .seg {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 4px; border-radius: 999px; pointer-events: auto;
  }
  .seg button {
    position: relative; z-index: 1; border: 0; background: none; font: inherit;
    font-weight: 500; font-size: 13px; color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px;
    transition: color var(--t);
  }
  .seg button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; }
  .seg button[aria-pressed="true"] { color: #1f2933; }
  .seg .pill {
    position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px;
    background: var(--glass-strong); box-shadow: 0 4px 16px rgba(0,0,0,.08);
    transition: transform .7s cubic-bezier(.5,1.6,.4,1), width .7s cubic-bezier(.5,1.6,.4,1), background var(--t);
  }

  /* clock */
  .clock {
    position: absolute; top: 80px; left: 24px; padding: 16px 20px 14px; border-radius: 22px;
    min-width: 200px; pointer-events: auto;
  }
  .clock .greet { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; transition: color var(--t); }
  .clock .time { font-size: 46px; font-weight: 300; letter-spacing: -.04em; line-height: 1.05; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .clock .time .sec { font-size: 16px; font-weight: 400; color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
  .clock .date { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  /* bottom cards */
  .cards {
    position: absolute; left: 0; right: 0; bottom: 20px; display: flex; gap: 12px;
    justify-content: center; padding: 0 20px; pointer-events: auto;
  }
  .card {
    width: 190px; border-radius: 20px; padding: 14px 16px; color: var(--card-ink);
    text-shadow: 0 1px 8px rgba(0,0,0,.18); transition: transform .4s cubic-bezier(.3,1.4,.5,1), background var(--t);
    background: rgba(255,255,255,.14);
  }
  body[data-phase="night"] .card { background: rgba(110,130,200,.14); }
  .card:hover { transform: translateY(-4px); }
  .card .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .8; font-weight: 500; }
  .card .big { font-size: 26px; font-weight: 300; margin-top: 6px; letter-spacing: -.02em; }
  .card .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ring { width: 42px; height: 42px; }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .bg { stroke: rgba(255,255,255,.25); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke var(--t), stroke-dashoffset .5s; }
  .bar { height: 4px; border-radius: 9px; background: rgba(255,255,255,.25); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 38%; background: var(--accent); border-radius: 9px; transition: background var(--t); }
  .sunico { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #ffe2a8, var(--accent)); box-shadow: 0 0 24px var(--accent); transition: background var(--t), box-shadow var(--t); }
  body[data-phase="night"] .sunico { background: radial-gradient(circle at 40% 38%, #ffffff, #cfd8ff); box-shadow: 0 0 22px rgba(210,220,255,.8); }
  .play { width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); display: grid; place-items: center; cursor: pointer; }
  .play svg { width: 13px; height: 13px; fill: #1f2933; }

  .hint { position: absolute; right: 76px; top: 32px; font-size: 11px; color: var(--ink-soft); transition: color var(--t); }
  .snd { position: absolute; top: 20px; right: 20px; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; pointer-events: auto; color: var(--ink); }
  .snd svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .snd.on { box-shadow: var(--shadow), 0 0 0 2px var(--accent) inset; }
  .snd .wave { transition: opacity .3s; } .snd:not(.on) .wave { opacity: 0; } .snd.on .x { opacity: 0; }

  @media (max-width: 760px) {
    .ui { padding: 16px; }
    .seg { top: max(14px, env(safe-area-inset-top)); }
    .seg button { padding: 7px 11px; font-size: 13px; gap: 5px; }
    .clock { top: 70px; left: 16px; min-width: 0; padding: 12px 16px; }
    .clock .time { font-size: 38px; }
    .cards { justify-content: flex-start; overflow-x: auto; padding: 0 16px 4px; scrollbar-width: none; }
    .card { flex: 0 0 170px; }
    .hint { display: none; }
    .snd { top: 74px; right: 16px; }
  }
</style>
</head>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

/* ------------------------------------------------------------------ setup */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9dce6, 40, 190);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
const isMobile = matchMedia('(max-width: 760px)').matches || navigator.maxTouchPoints > 1;

/* ------------------------------------------------------------------ terrain height */
function hgt(x, z) {
  let h = 7.5 * Math.exp(-(x * x) / 1800 - ((z + 48) ** 2) / 1000);
  h += 0.5 * Math.sin(x * 0.15 + 1.0) * Math.cos(z * 0.12);
  h += 10 * Math.exp(-((x + 80) ** 2) / 1800 - ((z + 140) ** 2) / 1300);
  h += 8 * Math.exp(-((x - 85) ** 2) / 2400 - ((z + 160) ** 2) / 1600);
  return h;
}

/* ------------------------------------------------------------------ palettes (morning, golden, night) */
const hex = a => a.map(h => new THREE.Color(h));
const PAL = {
  top:      hex(['#3b80d4', '#9c93bf', '#060f2b']),
  mid:      hex(['#8cc3ee', '#e7b0b0', '#14245a']),
  horizon:  hex(['#e6f1f3', '#fdd0a0', '#2a3f78']),
  cloudLit: hex(['#ffffff', '#ffe0c4', '#56649a']),
  cloudShade: hex(['#98b2d4', '#c08ea6', '#1a2550']),
  mountFar: hex(['#b6cfe3', '#efbfae', '#22346c']),
  mountNear:hex(['#93b3ce', '#d8a29e', '#1a2a5a']),
  fog:      hex(['#c7dae4', '#f2c69e', '#16244d']),
  base:     hex(['#1b4512', '#2f4f12', '#04241f']),
  tip:      hex(['#86cc4a', '#a9cf4c', '#3a9f86']),
  light:    hex(['#fff0d4', '#ffd2a0', '#5a78b8']),
  ambient:  hex(['#7a8f9e', '#8f7a6a', '#1d3346']),
  sun:      hex(['#fff6e0', '#ffd27a', '#ff9a50']),
  sunCore:  hex(['#fffdf6', '#fff6dc', '#ffe0b0']),
  sunGlow:  hex(['#ffe4b8', '#ffb066', '#ff7a3d']),
  mist:     hex(['#e6f0f4', '#ffd9b8', '#2c3f72']),
  hemiSky:  hex(['#cfe6ff', '#ffd6b0', '#5a72b8']),
  hemiGnd:  hex(['#3b5a24', '#5a4a20', '#163a40']),
  cloud:    hex(['#ffffff', '#ffd9c2', '#3a4a80']),
  leaf:     hex(['#ffffff', '#fff0d8', '#9fb8e0']),
};
const SUN  = [[-20, 36], [26, 5], [42, -14]];
const CLOUD_COVER = [0.53, 0.46, 0.38];
const MIST = [0.36, 0.28, 0.42];   // low-lying air / haze strength per phase
const MOON = [[-50, -28], [-35, -14], [-12, 19]];
const tmpC = new THREE.Color();
function samp(key, ph, out = new THREE.Color()) {
  const a = PAL[key], i = Math.min(Math.floor(ph), 1), f = ph - i;
  return out.copy(a[i]).lerp(a[i + 1], f);
}
function sampArr(arr, ph) {
  const i = Math.min(Math.floor(ph), 1), f = ph - i;
  return [arr[i][0] + (arr[i + 1][0] - arr[i][0]) * f, arr[i][1] + (arr[i + 1][1] - arr[i][1]) * f];
}
function dirFrom(az, el, out = new THREE.Vector3()) {
  az = THREE.MathUtils.degToRad(az); el = THREE.MathUtils.degToRad(el);
  return out.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
}

/* ------------------------------------------------------------------ shared uniforms */
const TRAIL = 24;
const U = {
  uTime: { value: 0 },
  uTrail: { value: Array.from({ length: TRAIL }, () => new THREE.Vector4(0, 0, 0, 1)) },
  uWind: { value: new THREE.Vector2(0.8, -0.6).normalize() },
  uFogColor: { value: new THREE.Color() },
  uFogNear: { value: 25 }, uFogFar: { value: 175 },
  uBase: { value: new THREE.Color() }, uTip: { value: new THREE.Color() },
  uLight: { value: new THREE.Color() }, uAmbient: { value: new THREE.Color() },
  uSunDir: { value: new THREE.Vector3() }, uMoonDir: { value: new THREE.Vector3() },
  uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
  uSunColor: { value: new THREE.Color() }, uSunGlow: { value: new THREE.Color() },
  uNight: { value: 0 }, uGolden: { value: 0 },
  uMid: { value: new THREE.Color() }, uCloudLit: { value: new THREE.Color() }, uCloudShade: { value: new THREE.Color() },
  uMountFar: { value: new THREE.Color() }, uMountNear: { value: new THREE.Color() }, uCloudCover: { value: 0.5 },
  uSunCore: { value: new THREE.Color() }, uMist: { value: 0.4 }, uMistColor: { value: new THREE.Color() },
  uTreeXZ: { value: new THREE.Vector2(1.5, -50) }, uMorning: { value: 1 },
};

const COMMON = /* glsl */`
  uniform float uTime; uniform vec4 uTrail[${TRAIL}]; uniform vec2 uWind;
  vec3 sway(vec3 o, float h, float scale, float rnd, out float sheen, out float press){
    float g = sin(dot(o.xz, vec2(0.13, 0.05)) - uTime * 1.25) + 0.5 * sin(dot(o.xz, vec2(-0.05, 0.21)) - uTime * 0.8);
    sheen = g;
    float bend = h * h * scale;
    vec2 d = uWind * (0.18 + 0.22 * (g * 0.5 + 0.5)) * bend;
    d += vec2(cos(rnd * 40.0), sin(rnd * 40.0)) * 0.18 * bend;
    d += vec2(-uWind.y, uWind.x) * sin(uTime * 3.1 + rnd * 30.0) * 0.04 * bend;
    press = 0.0;
    for (int i = 0; i < ${TRAIL}; i++) {
      vec4 t = uTrail[i];
      if (t.z <= 0.001) continue;
      vec2 q = o.xz - t.xy;
      float dist = length(q);
      float f = (1.0 - smoothstep(0.0, t.w, dist)) * t.z;
      if (f > 0.0) { d += normalize(q + 1e-4) * f * 1.2 * bend; press = max(press, f); }
    }
    // freshly disturbed blades rustle and quiver before settling
    d += vec2(-uWind.y, uWind.x) * sin(uTime * 13.0 + rnd * 40.0) * press * press * 0.22 * bend;
    float len = length(d);
    return vec3(d.x, -min(len * len / max(scale, 0.1) * 0.6 + len * 0.25 * h, h * scale * 0.8), d.y);
  }
`;
const colorOut = '#include <colorspace_fragment>';
// soft cloud shadows that drift across the meadow with the wind
const SHADOW = /* glsl */`
  uniform float uCloudCover;
  float sh_h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float sh_n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(sh_h(i), sh_h(i + vec2(1, 0)), f.x), mix(sh_h(i + vec2(0, 1)), sh_h(i + vec2(1, 1)), f.x), f.y); }
  float cloudShadow(vec2 xz, float t){
    vec2 p = xz * 0.035 + vec2(-t * 0.06, t * 0.02);
    float n = sh_n(p) * 0.65 + sh_n(p * 2.3 + 5.0) * 0.35;
    return smoothstep(0.42, 0.68, n) * (0.4 + uCloudCover * 0.6);
  }
`;
// aerial perspective: distance haze tinted toward the sun + low-lying ground mist that pools in the dips
// (expects uFogColor, uFogNear, uFogFar, uSunDir, uSunGlow, uNight, uTime to be declared)
const AIR = /* glsl */`
  uniform float uMist; uniform vec3 uMistColor;
  vec3 applyAir(vec3 col, vec3 w, float dist){
    vec3 vd = normalize(w - cameraPosition);
    float sunAmt = pow(max(dot(vd, uSunDir), 0.0), 5.0) * (1.0 - uNight) * smoothstep(-0.12, 0.05, uSunDir.y);
    vec3 fc = uFogColor + uSunGlow * sunAmt * 0.4;
    col = mix(col, fc, smoothstep(uFogNear, uFogFar, dist));
    float drift = 0.75 + 0.25 * sin(w.x * 0.08 + uTime * 0.07) * sin(w.z * 0.11 - uTime * 0.05);
    float mist = uMist * drift * exp(-max(w.y - 0.3, 0.0) * 0.38) * smoothstep(5.0, 38.0, dist);
    col = mix(col, uMistColor + uSunGlow * sunAmt * 0.3, clamp(mist, 0.0, 0.8));
    return col;
  }
`;

/* ------------------------------------------------------------------ sky */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: U,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){ vec4 wp = modelMatrix * vec4(position,1.); vDir = wp.xyz - cameraPosition;
        gl_Position = projectionMatrix * viewMatrix * wp; gl_Position.z = gl_Position.w; }`,
    fragmentShader: /* glsl */`
      uniform vec3 uTop, uMid, uHorizon, uSunColor, uSunCore, uSunGlow, uSunDir, uMoonDir;
      uniform vec3 uCloudLit, uCloudShade, uMountFar, uMountNear;
      uniform float uNight, uGolden, uTime, uCloudCover, uMorning;
      varying vec3 vDir;
      float hash(vec3 p){ p = fract(p * 0.3183099 + .1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(h2(i), h2(i + vec2(1, 0)), f.x), mix(h2(i + vec2(0, 1)), h2(i + vec2(1, 1)), f.x), f.y); }
      float fbm(vec2 p){ float a = 0.5, s = 0.0; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
        for (int i = 0; i < 5; i++){ s += a * n2(p); p = m * p; a *= 0.5; } return s; }
      void main(){
        vec3 d = normalize(vDir);
        float y = d.y;
        // three-stop gradient: hazy horizon -> soft mid blue -> deep zenith
        vec3 col = mix(uHorizon, uMid, smoothstep(-0.02, 0.24, y));
        col = mix(col, uTop, smoothstep(0.2, 0.8, y));

        // sun scattering + soft rays
        float sd = max(dot(d, uSunDir), 0.0);
        float sunVis = smoothstep(-0.10, 0.02, uSunDir.y);
        // layered bloom: tight halo hugging the disc, medium corona, wide warm wash near the horizon
        float glow = pow(sd, 2200.0) * 0.55 + pow(sd, 260.0) * 0.32 + pow(sd, 40.0) * 0.18
                   + pow(sd, 6.0) * (0.10 + 0.28 * uGolden) * (1.0 - smoothstep(0.0, 0.5, y));
        col += uSunGlow * glow * sunVis;
        // broad, soft brightening of the whole sky region around the sun (Mie-ish haze)
        col += uSunGlow * pow(sd, 3.0) * 0.16 * sunVis * (1.0 - uNight);

        // early-morning blush: a warm peach band low on the horizon, strongest on the sun's side
        vec2 sh2 = normalize(uSunDir.xz + 1e-4);
        float side = 0.5 + 0.5 * dot(normalize(d.xz + 1e-4), sh2);
        col = mix(col, vec3(1.0, 0.86, 0.74), (1.0 - smoothstep(0.0, 0.38, y)) * (0.18 + 0.45 * side * side) * uMorning);

        // procedural clouds on a sky dome plane
        float dens = 0.0;
        if (y > 0.0) {
          vec2 cp = d.xz / (y + 0.08) * 0.9 + vec2(uTime * 0.010, uTime * 0.003);
          float n = fbm(cp);
          float ns = fbm(cp + uSunDir.xz * 0.15);

      col = mix(vec3(l), col, uSat);

      col = col * uGain + uLift * (1.0 - col);
      col *= mix(1.0 - uVignette, 1.0, smoothstep(0.9, 0.28, length(c * vec2(1.0, 0.82))));
      // warm sunlight spilling in from where the sun sits just off-frame
      vec2 sv = (vUv - uSunUV) * vec2(uAspect, 1.0);
      col += vec3(1.0, 0.86, 0.62) * uGlare * (exp(-length(sv) * 2.4) + 0.35 * exp(-length(sv) * 0.9)) * (1.0 - col * 0.5);
      float n = fract(sin(dot(vUv * vec2(1234.5, 987.6) + fract(uTime) * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
      col += n * uGrain;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }`,
});
composer.addPass(grade);

// per-phase look: [shaft strength, shaft threshold, bloom strength, bloom threshold, saturation, gain rgb, lift rgb]
const LOOK = [
  { gl: 0.2, sh: 0.5, th: 0.93, bs: 0.38, bt: 1.0, sat: 1.13, gain: [1.03, 1.01, 0.98], lift: [0.012, 0.012, 0.03], tint: '#ffe9c4' },
  { gl: 0.1, sh: 0.8, th: 0.82, bs: 0.42, bt: 0.95, sat: 1.12, gain: [1.05, 1.0, 0.93], lift: [0.025, 0.006, 0.03], tint: '#ffc890' },
  { gl: 0.0, sh: 0.3, th: 0.5, bs: 0.55, bt: 0.7, sat: 1.0, gain: [0.94, 1.0, 1.08], lift: [0.0, 0.012, 0.035], tint: '#b8c8ff' },
];
const _sp = new THREE.Vector3(), _lk = {}, _tint = new THREE.Color(), _tintB = new THREE.Color();
function updatePost(ph, t) {
  const i = Math.min(Math.floor(ph), 1), f = ph - i, A = LOOK[i], B = LOOK[i + 1];
  const L = (k) => A[k] + (B[k] - A[k]) * f;
  // light source on screen: sun while it's up, otherwise the moon
  const src = U.uSunDir.value.y > -0.03 ? U.uSunDir.value : U.uMoonDir.value;
  _sp.copy(camera.position).addScaledVector(src, 400).project(camera);
  const facing = _sp.z < 1 ? 1 : 0;
  shafts.uniforms.uSun.value.set(_sp.x * 0.5 + 0.5, _sp.y * 0.5 + 0.5);
  shafts.uniforms.uStrength.value = L('sh') * facing;
  shafts.uniforms.uThresh.value = L('th');
  shafts.uniforms.uTint.value.copy(_tint.set(A.tint).lerp(_tintB.set(B.tint), f));
  bloom.strength = L('bs'); bloom.threshold = L('bt');
  grade.uniforms.uSat.value = L('sat');
  grade.uniforms.uGain.value.set(...A.gain.map((v, k) => v + (B.gain[k] - v) * f));
  grade.uniforms.uLift.value.set(...A.lift.map((v, k) => v + (B.lift[k] - v) * f));
  grade.uniforms.uTime.value = t;
  grade.uniforms.uGlare.value = L('gl') * facing;
  grade.uniforms.uSunUV.value.copy(shafts.uniforms.uSun.value);
  grade.uniforms.uAspect.value = camera.aspect;
}

/* ------------------------------------------------------------------ resize */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 62 : 50;
  camera.updateProjectionMatrix();
  placePill(Math.round(tw ? tw.to : phase));
}
addEventListener('resize', resize); resize();

/* ------------------------------------------------------------------ loop */
const clock = new THREE.Clock();
const look = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  U.uTime.value = t;

  if (tw) {
    const k = Math.min(1, (now - tw.t0) / tw.dur);
    phase = tw.from + (tw.to - tw.from) * ease(k);
    if (k >= 1) tw = null;
  }
  const ph = THREE.MathUtils.clamp(phase, 0, 2);
  const night = THREE.MathUtils.smoothstep(ph, 1.2, 2);
  const golden = 1 - Math.min(1, Math.abs(ph - 1));
  U.uNight.value = night; U.uGolden.value = golden; U.uMorning.value = 1 - THREE.MathUtils.smoothstep(ph, 0, 0.9);

  ['top', 'horizon', 'base', 'tip', 'light', 'ambient', 'sun', 'sunGlow'].forEach(k => {
    const map = { top: 'uTop', horizon: 'uHorizon', base: 'uBase', tip: 'uTip', light: 'uLight', ambient: 'uAmbient', sun: 'uSunColor', sunGlow: 'uSunGlow' };
    samp(k, ph, U[map[k]].value);
  });
  samp('fog', ph, U.uFogColor.value);
  scene.fog.color.copy(U.uFogColor.value);

  // the little amber sun: travels along its arc during transitions and drifts gently at rest
  const [saz, sel] = sampArr(SUN, ph);
  dirFrom(saz + Math.sin(t * 0.05) * 1.5, sel + Math.sin(t * 0.07) * 0.6, U.uSunDir.value);
  const [maz, mel] = sampArr(MOON, ph);
  dirFrom(maz, mel, U.uMoonDir.value);

  // tree lighting
  samp('hemiSky', ph, hemi.color); samp('hemiGnd', ph, hemi.groundColor);
  hemi.intensity = 1.6 + golden * 0.6 - night * 0.3;
  const keyDir = U.uSunDir.value.y > 0.02 ? U.uSunDir.value : U.uMoonDir.value;
  dirLight.position.copy(tree.position).addScaledVector(keyDir, 50);
  dirLight.target.position.copy(tree.position);
  samp('light', ph, dirLight.color);
  dirLight.intensity = 2.2 - night * 1.1;
  tree.rotation.z = Math.sin(t * 0.8) * 0.006;

  // sky extras
  samp('mid', ph, U.uMid.value);
  samp('cloudLit', ph, U.uCloudLit.value); samp('cloudShade', ph, U.uCloudShade.value);
  samp('mountFar', ph, U.uMountFar.value); samp('mountNear', ph, U.uMountNear.value);
  { const i = Math.min(Math.floor(ph), 1), f = ph - i; U.uCloudCover.value = CLOUD_COVER[i] + (CLOUD_COVER[i + 1] - CLOUD_COVER[i]) * f;
    // the air "breathes": mist slowly thickens and thins over a couple of minutes
    const breathe = 0.7 + 0.3 * Math.sin(t * 0.045) + 0.12 * Math.sin(t * 0.13 + 1.7);
    U.uMist.value = (MIST[i] + (MIST[i + 1] - MIST[i]) * f) * breathe; }
  samp('sunCore', ph, U.uSunCore.value);
  samp('mist', ph, U.uMistColor.value);
  leafMat.emissive.copy(U.uSunGlow.value).multiplyScalar(0.06 * golden); // warm light glowing through the crown
  for (const w of wisps) {
    w.position.x += w.userData.speed * dt;
    if (w.position.x > 45) w.position.x = -45;
    w.position.y = hgt(w.position.x, w.position.z) + w.scale.y * 0.32;
  }

  updateBirds(t, dt, night, golden);
  cat.update(t, dt, night);
  Sound.setState(ph, night, U.uMorning.value, golden);
  pollenU.uDay.value = 1 - night;
  seedsU.uSeedAmt.value = (1 - night) * (0.35 + 0.65 * U.uMorning.value);   // most plentiful in the morning

  // trail decay
  for (const v of trail) v.z = Math.max(0, v.z - dt * 0.28);

  // subtle parallax
  parallax.lerp(parallaxT, 0.03);
  if (!window.__camOverride) {
  camera.position.set(camBase.x + parallax.x * 0.4, camBase.y - parallax.y * 0.12, camBase.z);
  look.set(lookBase.x + parallax.x * 0.8, lookBase.y - parallax.y * 0.3, lookBase.z);
  camera.lookAt(look);
  }

  updatePost(ph, t);
  composer.render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
