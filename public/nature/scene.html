    if (w.position.x > 45) w.position.x = -45;
    w.position.y = hgt(w.position.x, w.position.z) + w.scale.y * 0.32;

  // No white airborne motes in Morning: even small ones visibly blink.
  // Fade them with the existing phase tween, preserving Golden/Night looks.
  const airborne = (1 - night) * (1 - U.uMorning.value);
  pollenU.uDay.value = airborne * seasonWeights[0];
  pollen.visible = pollenU.uDay.value > 0.001;
  fireflies.visible = night > 0.001 && seasonWeights[0] > 0.001;
  fireflies.material.uniforms.uNight.value = night * seasonWeights[0];
  seedsU.uSeedAmt.value = airborne * 0.35 * seasonWeights[0];
  seeds.visible = seedsU.uSeedAmt.value > 0.001;

  // trail decay

  // subtle parallax
  if (!motionPaused) parallax.lerp(parallaxT, 0.03);
  if (!window.__camOverride) {
  camera.position.set(camBase.x + parallax.x * 0.4, camBase.y - parallax.y * 0.12, camBase.z);
  look.set(lookBase.x + parallax.x * 0.8, lookBase.y - parallax.y * 0.3, lookBase.z);
  camera.lookAt(look);
  }

  summerMorningScenery.update(summerMorningWeight(ph, seasonWeights[0]));
  grade.uniforms.uContrast.value = 1.05 + 0.07 * summerMorningWeight(ph, seasonWeights[0]);
  updatePost(ph, t);
  shafts.uniforms.uStrength.value *= 1 + 1.4 * summerMorningWeight(ph, seasonWeights[0]);
  composer.render(dt);
}

/* ------------------------------------------------------------------ 30fps cap + adaptive resolution

const FRAME_MS = 1000 / 30;

const MIN_SCALE = (isMobile ? 0.85 : 1) / basePR();
